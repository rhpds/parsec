app:
  name: parsec
  port: 8000
  host: "0.0.0.0"
  log_level: info

anthropic:
  # backend: "api" (direct), "vertex" (GCP Vertex AI), "bedrock" (AWS Bedrock),
  #          or "litellm" (LiteLLM proxy)
  backend: "api"
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  max_tool_rounds: 10
  # Model for the orchestrator agent. Sub-agents always use the main 'model'
  # above. Set to a faster model (e.g. claude-haiku) to reduce orchestrator
  # routing latency. Empty = same as model.
  # orchestrator_model: ""
  # Vertex AI settings (when backend: "vertex")
  # vertex_project_id: ""  # falls back to gcp.project_id
  # vertex_region: "us-east5"
  # Bedrock settings (when backend: "bedrock")
  # bedrock_region: ""  # falls back to aws.region
  # LiteLLM proxy settings (used when any component has backend: "litellm")
  # litellm_base_url: ""  # e.g. "https://maas-rhdp.apps.maas.redhatworkshops.io"
  # litellm_api_key: ""
  # Per-component overrides. Keys: orchestrator, cost, aap2, babylon,
  # security, ocpv, icinga, learnings, aap2_fix.
  # Each can override: backend, model, max_tokens.
  # Unspecified keys inherit from top-level defaults.
  # overrides:
  #   orchestrator:
  #     backend: "litellm"
  #     model: "qwen3-14b"
  #   aap2:
  #     model: "claude-opus-4-6"

provision_db:
  # Direct DB access removed — all queries go through the Reporting MCP.
  # max_rows is still used to limit query results sent to the MCP.
  max_rows: 500

aws:
  profile: "athena"
  region: "us-east-1"
  batch_size: 100

azure:
  storage_account: ""
  container: ""

azure_cosmos:
  endpoint: ""
  key: ""

gcp:
  project_id: ""
  billing_dataset: ""
  billing_account_id: ""
  open_envs_folder_id: ""

cost_monitor:
  # Internal API URL (cross-namespace within OpenShift cluster)
  api_url: "http://cost-data-service.cost-monitor.svc:8000"
  # User-facing dashboard URL (for linking)
  dashboard_url: ""

cloudtrail:
  event_data_store_id: ""

babylon:
  # Babylon cluster connections for catalog/deployment lookups.
  # Each cluster needs a kubeconfig (token-based or client certificate).
  # Set kubeconfig paths in config.local.yaml.
  # Cluster resolution: the sandbox DynamoDB comment field contains the
  # Babylon console URL — the tool extracts the cluster domain and matches
  # it against configured cluster server URLs automatically.
  clusters: {}
  #   east:
  #     kubeconfig: "~/secrets/babylon-prod.kubeconfig"
  #   west:
  #     kubeconfig: "~/secrets/babylon-west.kubeconfig"

ocpv:
  clusters: {}

aap2:
  # AAP2 controller connections for job investigation.
  # Each controller needs a URL and credentials (username/password).
  # Set credentials in config.local.yaml or via env vars
  # (PARSEC_AAP2__CLUSTERS__EAST__PASSWORD, etc.).
  clusters: {}
  #   east:
  #     url: "https://aap2-prod-us-east-2.aap.infra.demo.redhat.com"
  #     username: "monitor"
  #     password: ""

github:
  # GitHub PAT for accessing private agnosticv repos (read-only).
  # Set via PARSEC_GITHUB__TOKEN env var or parsec-secrets secret.
  # Needs `repo` scope for access to rhpds private repos.
  token: ""
  # GitHub remote MCP server URL (streamable HTTP).
  # Uses GitHub's hosted MCP server — no sidecar needed.
  # Auth via PAT in Authorization header (uses github.token above).
  mcp_url: "https://api.githubcopilot.com/mcp/"

reporting_mcp:
  # Reporting MCP server URL (streamable HTTP transport).
  # Runs in the demo-reporting namespace on the same OpenShift cluster.
  # Cross-namespace access via OpenShift Service DNS.
  # Set in config.local.yaml or PARSEC_REPORTING_MCP__MCP_URL.
  mcp_url: ""
  # Bearer token for MCP Token Auth.
  # Set via PARSEC_REPORTING_MCP__TOKEN env var or parsec-secrets secret.
  token: ""

icinga:
  # Icinga MCP server URL (SSE transport).
  # Runs as a sidecar container (quay.io/rhpds/monitoring-mcp) sharing the
  # network namespace (network_mode: service:parsec in compose, same pod in k8s).
  # The MCP server's transport security requires Host=localhost, so always use
  # localhost (not the service name).
  # Set in config.local.yaml or PARSEC_ICINGA__MCP_URL.
  mcp_url: ""
  # --- Agent SDK runtime only (agent.runtime: sdk) ---
  # Under the SDK the Icinga backend is a raw MCP server, so `allowed_tools` is
  # the only thing standing between the model and Icinga's write actions
  # (acknowledge_problem, schedule_downtime, reschedule_check, add_comment,
  # remove_comment, remove_downtime). The profile grants read-only tools only.
  # sdk_allow_writes: false   # grant the six write actions as well
  # sdk_allowed_tools: []     # override the tool list outright, for a sidecar
  #                           # that names its tools differently

splunk:
  # Red Hat Corporate Splunk REST API endpoint.
  # Uses federated search to query Splunk Cloud (rhcorporate.splunkcloud.com)
  # via the on-prem API host (splunk-api.corp.redhat.com:8089).
  # Set token via PARSEC_SPLUNK__TOKEN env var or parsec-secrets.
  # Requires VPN or internal network access (port 8089).
  host: "https://splunk-api.corp.redhat.com"
  token: ""
  # username: ""
  # password: ""
  verify_ssl: false  # self-signed cert on internal endpoint

# MLflow tracking server for agent performance metrics.
# Set tracking_url to enable metrics collection.
# Leave empty to disable (metrics silently skipped).
# Authentication: set MLFLOW_TRACKING_USERNAME and MLFLOW_TRACKING_PASSWORD
# environment variables (MLflow SDK standard). Do NOT put credentials here.
mlflow:
  tracking_url: ""
  experiment_name: "parsec-agent-metrics"

alert_api_key: ""

learnings:
  # Comma-separated list of users who can view/manage agent learnings
  # These users see the learnings panel in the sidebar
  admin_users: "prutledg@redhat.com,andrjone@redhat.com,yordangit@redhat.com"
  # Comma-separated list of OpenShift groups that grant admin access
  admin_groups: "ace-octo-team"
  # Set to true in config.local.yaml to allow anonymous (no OAuth) admin access
  # NEVER set this in production
  allow_anonymous_admin: false

debug:
  # Write the full LLM request payload (system prompt, messages, tools) to
  # data/debug/ as JSON before each API call. Useful for prompt inspection.
  dump_prompts: false

agent:
  # Which LLM runtime drives the orchestrator + sub-agents.
  #   legacy — direct anthropic SDK (today's default, unchanged behavior)
  #   sdk    — Claude Agent SDK (experimental; requires `pip install claude-agent-sdk`)
  # See artifacts/parsec-agent-sdk-migration-plan.md for the migration plan.
  runtime: "legacy"
  # SDK-specific overrides (only honored when runtime: sdk)
  sdk:
    # model: ""          # falls back to anthropic.model
    # max_turns: 10      # falls back to anthropic.max_tool_rounds
    # cwd: ""            # working directory for the SDK subprocess (default: pwd)
    # Which sub-agents may run on the SDK. Requires runtime: sdk as well, so
    # `agent.runtime: legacy` stays a universal kill switch. Use ["all"] for
    # every agent, or a subset like ["icinga", "ocpv"] to migrate gradually.
    enabled_agents: ["icinga"]
    # Orchestrate the WHOLE turn with the SDK: one ClaudeSDKClient session with
    # the sub-agents as native SDK subagents, delegating via the Agent tool.
    # When false, only the individual sub-agents listed above run on the SDK and
    # the legacy orchestrator loop still routes them.
    orchestrator: false
    # Permit state-mutating tool actions (currently only the Icinga writes:
    # acknowledge, schedule/remove downtime, add/remove comment).
    allow_writes: false
    setting_sources: ["project"]   # where the SDK discovers SKILL.md files
    # Extra env vars merged into the subprocess (e.g. OTel). The subprocess
    # inherits an ALLOWLIST of the app's environment, never all of it — see
    # build_subprocess_env() in src/llm/agent_sdk_client.py. Anything outside
    # that list (for example AWS credentials for a Bedrock backend) has to be
    # granted here explicitly.
    env: {}
    timeout: 300         # per-call wall-clock ceiling (seconds); null/0 disables
    # cli_path: ""       # absolute path to the `claude` binary. Empty leaves the
    #                    # choice to the SDK, whose _find_cli() prefers the CLI
    #                    # bundled inside the claude-agent-sdk wheel over the
    #                    # npm-installed one on PATH — so the Dockerfile's
    #                    # `npm install -g @anthropic-ai/claude-code@<pin>` does
    #                    # NOT decide which binary runs. Set this to make it do so.

skills:
  # Discovery roots for agent skills (SKILL.md directories).
  # See src/skills/loader.py and docs/migration/agent-sdk-plan.md.
  #
  # project_root: path (relative to cwd) for in-repo skills that ship with Parsec
  project_root: "skills"
  # plugin_paths: additional roots, typically mounted from external skill repos
  # (e.g. rhdp-rca-plugin). Listed paths are scanned for SKILL.md directories.
  #
  # Skills found here are BOTH listed by GET /api/skills and — since startup
  # publishes every discovered skill into <cwd>/.claude/skills (see
  # src/skills/sdk_root.py) — loadable by the Agent SDK. GET /api/skills reports
  # `sdk_visible` per skill, so a mount that the SDK cannot see is visible as
  # such rather than silently inert.
  #
  # Each listed path is a directory OF skill directories, i.e.
  # /opt/rhdp-rca-plugin/skills/root-cause-analysis/SKILL.md, not the SKILL.md
  # itself. Skill names must be unique across roots; project_root wins on a
  # collision (see SkillLoader._deduplicate).
  plugin_paths: []
  #   - "/opt/rhdp-rca-plugin/skills"
  # user_root: per-user skill directory for local dev only.
  # Leave empty in production deploys.
  user_root: ""

auth:
  # Comma-separated list of allowed OpenShift groups (from X-Forwarded-Groups)
  # When set, only users in these groups (or in allowed_users) can access Parsec
  # When empty, group check is skipped and allowed_users is used instead
  allowed_groups: "rhpds-admins,parsec-local-users,ace-octo-team"
  # Comma-separated list of allowed email addresses or usernames (fallback)
  # When empty and allowed_groups is also empty, all authenticated users are allowed
  allowed_users: ""
