sonar.projectKey=com.redhat.rhpds.parsec
sonar.qualitygate.wait=true

sonar.python.version=3.11
sonar.sources=src,static

sonar.exclusions=\
  .github/**,\
  .venv/**,\
  data/**,\
  scripts/**,\
  playbooks/**,\
  config/config.local.yaml

sonar.test.inclusions=\
  **/tests/**/*.py,\
  **/test_*.py

sonar.python.coverage.reportPaths=coverage.xml

# Suppress false positives
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18

# Dockerfile COPY --chown=1001:0 is required by OpenShift to run as non-root
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*

# Babylon clusters use self-signed certs — TLS hostname verification intentionally disabled
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5527
sonar.issue.ignore.multicriteria.e2.resourceKey=src/connections/babylon.py

# Babylon clusters use self-signed certs — TLS certificate validation intentionally disabled
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e3.resourceKey=src/connections/babylon.py

# False positive on async generator in tests
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S3862
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**

# Log injection false positives — logging request metadata (user email, correlation IDs) is standard practice
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S5145
sonar.issue.ignore.multicriteria.e5.resourceKey=src/**

# Async tool functions without await — called as coroutines by the Claude tool-use loop, must remain async
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e6.resourceKey=src/tools/**

sonar.issue.ignore.multicriteria.e7.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e7.resourceKey=src/connections/**

# Fast-path classifier regexes are intentionally complex — they match domain keywords for query routing
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e8.resourceKey=src/agent/agents.py

# Hardcoded AWS regions are intentional — global services (us-east-1) and org-specific resource locations
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S6262
sonar.issue.ignore.multicriteria.e9.resourceKey=src/tools/**

# Timeout parameters are config-driven, not hardcoded security risks
sonar.issue.ignore.multicriteria.e10.ruleKey=python:S7483
sonar.issue.ignore.multicriteria.e10.resourceKey=src/**

# Browser-only JS — window is idiomatic; globalThis adds no value
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e11.resourceKey=static/**

# CSS contrast depends on dark theme context that static analysis cannot evaluate
sonar.issue.ignore.multicriteria.e12.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.e12.resourceKey=static/**

# Deeply nested callbacks are inherent to DOM event + SSE streaming patterns in vanilla JS
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.e13.resourceKey=static/**

# Top-level await requires ES modules; browser script tag is classic (not type=module)
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S7785
sonar.issue.ignore.multicriteria.e14.resourceKey=static/**

# Unused function parameters that are part of required interfaces (callbacks, method signatures)
sonar.issue.ignore.multicriteria.e15.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e15.resourceKey=src/llm/**

# Implicit string concatenation is intentional f-string formatting
sonar.issue.ignore.multicriteria.e16.ruleKey=python:S5799
sonar.issue.ignore.multicriteria.e16.resourceKey=src/agent/**

# run_agent is an async generator with irreducible structural complexity (yields + try/finally + spans)
sonar.issue.ignore.multicriteria.e17.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e17.resourceKey=src/agent/orchestrator.py

# Chart.js renders via constructor side-effect — new Chart() without assignment is intentional
sonar.issue.ignore.multicriteria.e18.ruleKey=javascript:S3735
sonar.issue.ignore.multicriteria.e18.resourceKey=static/**
