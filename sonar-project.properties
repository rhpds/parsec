sonar.projectKey=com.redhat.rhpds.parsec
sonar.qualitygate.wait=true

sonar.python.version=3.11
sonar.sources=src,static

sonar.exclusions=\
  .github/**,\
  .venv/**,\
  data/**,\
  scripts/**,\
  playbooks/**,\
  config/config.local.yaml

sonar.test.inclusions=\
  **/tests/**/*.py,\
  **/test_*.py

# Suppress false positives
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Dockerfile COPY --chown=1001:0 is required by OpenShift to run as non-root
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*

# Babylon clusters use self-signed certs — TLS hostname verification intentionally disabled
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5527
sonar.issue.ignore.multicriteria.e2.resourceKey=src/connections/babylon.py

# Babylon clusters use self-signed certs — TLS certificate validation intentionally disabled
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e3.resourceKey=src/connections/babylon.py

# False positive on async generator in tests
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S3862
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**

# Log injection false positives — logging request metadata (user email, correlation IDs) is standard practice
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S5145
sonar.issue.ignore.multicriteria.e5.resourceKey=src/**
