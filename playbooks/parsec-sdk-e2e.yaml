# Parsec on the Claude Agent SDK — human-led E2E / parity instance.
#
# Runs in `rh-ace-aiops` (deliberately NOT parsec-dev, which belongs to the RHDP
# team) with `agent.runtime: sdk`, every sub-agent enabled, and the whole turn
# orchestrated by the SDK. Everything is named `parsec-sdk*` so it cannot collide
# with the rhdp-rca-plugin resources already in the namespace.
#
# Connector parity with parsec-dev: the same eight secrets, the same icinga-mcp
# sidecar, and the same MCP/service URLs, so the ONLY variable between this and
# https://parsec-dev.apps.ocpv-infra01.dal12.infra.demo.redhat.com is the runtime.
# The secrets were copied from parsec-dev (they are namespace-scoped).
#
#   oc apply -f playbooks/parsec-sdk-e2e.yaml -n rh-ace-aiops
#   oc start-build parsec-sdk -n rh-ace-aiops --follow
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: parsec-sdk
  labels: {app: parsec-sdk}
spec:
  lookupPolicy: {local: true}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: parsec-sdk
  labels: {app: parsec-sdk}
spec:
  source:
    type: Git
    git:
      uri: https://github.com/PalmPalm7/parsec.git
      ref: migration/full-sdk
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: dockerfiles/Dockerfile
  output:
    to: {kind: ImageStreamTag, name: 'parsec-sdk:latest'}
  resources:
    limits: {cpu: '2', memory: 4Gi}
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
---
# ServiceAccount used as its own OAuth client, so browser traffic authenticates
# against OpenShift without needing a cluster-scoped OAuthClient (which this
# account cannot create).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parsec-sdk-oauth
  labels: {app: parsec-sdk}
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.primary: >-
      https://parsec-sdk-rh-ace-aiops.apps.ocpv-infra01.dal12.infra.demo.redhat.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parsec-sdk-config
  labels: {app: parsec-sdk}
data:
  # Mirrors parsec-dev's config.yaml. Differences are intentional and limited to
  # the agent block (the runtime flip) and auth (see below).
  config.yaml: |
    app:
      name: parsec
      port: 8000
      host: "0.0.0.0"
      log_level: info

    anthropic:
      # Verified available on Vertex in itpc-gcp-product-all-claude/us-east5.
      # Deliberately NOT litellm/qwen3-14b: parsec-dev overrides its orchestrator
      # onto that, which would make any comparison model-confounded.
      model: "claude-sonnet-4-6"
      max_tokens: 4096
      max_tool_rounds: 10

    provision_db:
      max_rows: 500

    aws:
      region: "us-east-1"
      batch_size: 100

    cost_monitor:
      api_url: "http://cost-data-service.cost-monitor.svc:8000"
      dashboard_url: "https://cost-monitor.apps.ocpv-infra01.dal12.infra.demo.redhat.com"

    cloudtrail:
      event_data_store_id: "03041e6e-ecfe-40bb-91db-c467e33c2313"

    alert_api_key: ""

    learnings:
      admin_users: "prutledg@redhat.com,andrjone@redhat.com"

    github:
      mcp_url: "https://api.githubcopilot.com/mcp/"

    mlflow:
      # Cross-namespace from rh-ace-aiops this is unreachable, so tracing stays
      # off here. Startup no longer hangs on it (see src/connections/mlflow_tracking.py).
      tracking_url: "http://mlflow-tracking.mlflow.svc:5000"
      experiment_name: "parsec-agent-metrics"

    # --- the only functional difference from parsec-dev ---
    agent:
      runtime: "sdk"
      sdk:
        enabled_agents: ["all"]
        orchestrator: true
        allow_writes: false
        setting_sources: ["project"]
        # 300s was too tight for multi-tool investigations: the SDK does its
        # tool work first and writes the answer last, so a cut-off yields
        # NOTHING (legacy interleaves text and at least leaves a partial).
        # Two of eight parity questions returned empty at 300s.
        timeout: 900
        cwd: "/app"

    skills:
      project_root: "skills"
      plugin_paths: []
      user_root: ""

    auth:
      # oauth-proxy establishes identity; the group check additionally needs the
      # `parsec-oauth` ClusterRole, which cannot be granted from this namespace.
      # So authorisation is the email allowlist rather than group membership.
      allowed_groups: ""
      allowed_users: "anxie@redhat.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parsec-sdk
  labels: {app: parsec-sdk}
spec:
  replicas: 1
  selector:
    matchLabels: {app: parsec-sdk}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: parsec-sdk}
    spec:
      containers:
        - name: parsec
          image: parsec-sdk:latest
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - secretRef: {name: parsec-cloud-credentials, optional: true}
            - secretRef: {name: parsec-aap2-credentials, optional: true}
          env:
            # Rollback switch: `oc set env deploy/parsec-sdk PARSEC_AGENT__RUNTIME=legacy`
            - name: PARSEC_AGENT__RUNTIME
              value: "sdk"
            # --- connectors, matching parsec-dev ---
            - name: PARSEC_REPORTING_MCP__MCP_URL
              value: "http://reporting-mcp.demo-reporting.svc:8080/mcp/"
            - name: PARSEC_ICINGA__MCP_URL
              value: "http://localhost:3000/sse"
            - name: PARSEC_GITHUB__TOKEN
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: github-token, optional: true}}
            - name: PARSEC_REPORTING_MCP__TOKEN
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: reporting-mcp-token, optional: true}}
            - name: PARSEC_ALERT_API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: alert-api-key, optional: true}}
            - name: PARSEC_ANTHROPIC__LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: litellm-api-key, optional: true}}
            - name: PARSEC_LEARNINGS__LOCAL__API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: litellm-api-key, optional: true}}
            # --- Vertex for Parsec's own Anthropic client (same as parsec-dev) ---
            - name: PARSEC_ANTHROPIC__BACKEND
              value: "vertex"
            - name: PARSEC_ANTHROPIC__VERTEX_PROJECT_ID
              value: "itpc-gcp-product-all-claude"
            - name: PARSEC_ANTHROPIC__VERTEX_REGION
              value: "us-east5"
            - name: PARSEC_ANTHROPIC__VERTEX_CREDENTIALS_PATH
              value: /app/gcp/service-account.json
            - name: PARSEC_GCP__CREDENTIALS_PATH
              value: /app/gcp-billing/service-account.json
            # NOTE: parsec-dev additionally overrides the ORCHESTRATOR onto
            # litellm/qwen3-14b (PARSEC_ANTHROPIC__OVERRIDES__ORCHESTRATOR__*).
            # Deliberately not copied — the whole point here is that the Agent
            # SDK orchestrates. It is a real confound for any answer-quality
            # comparison and must be stated alongside results.
            # --- Vertex for the `claude` CLI subprocess the SDK spawns ---
            # Same project/region as Parsec's own client so both arms bill and
            # resolve identically.
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/service-account.json
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              value: "itpc-gcp-product-all-claude"
            - name: CLOUD_ML_REGION
              value: "us-east5"
            - name: CLAUDE_CODE_ACCEPT_TOS
              value: "true"
            # --- Babylon / OCPV cluster kubeconfigs (mounted secrets) ---
            - {name: PARSEC_BABYLON__CLUSTERS__EAST__KUBECONFIG, value: /app/babylon/east.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__WEST__KUBECONFIG, value: /app/babylon/west.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__PARTNER0__KUBECONFIG, value: /app/babylon/partner0.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__PARTNER1__KUBECONFIG, value: /app/babylon/partner1.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__INTEGRATION__KUBECONFIG, value: /app/babylon/integration.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__BABYDEV__KUBECONFIG, value: /app/babylon/babydev.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV05__KUBECONFIG, value: /app/ocpv/ocpv05.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV06__KUBECONFIG, value: /app/ocpv/ocpv06.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV07__KUBECONFIG, value: /app/ocpv/ocpv07.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV08__KUBECONFIG, value: /app/ocpv/ocpv08.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV09__KUBECONFIG, value: /app/ocpv/ocpv09.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV10__KUBECONFIG, value: /app/ocpv/ocpv10.kubeconfig}
          volumeMounts:
            - {name: config, mountPath: /app/config/config.yaml, subPath: config.yaml}
            - {name: vertex-credentials, mountPath: /app/gcp, readOnly: true}
            - {name: gcp-billing-credentials, mountPath: /app/gcp-billing, readOnly: true}
            - {name: babylon-kubeconfigs, mountPath: /app/babylon, readOnly: true}
            - {name: ocpv-kubeconfigs, mountPath: /app/ocpv, readOnly: true}
            - {name: data, mountPath: /app/data}
          resources:
            requests: {cpu: '500m', memory: 1Gi}
            # CPU, not memory, is the binding constraint: every SDK turn spawns a
            # `claude` subprocess, and under a tight quota concurrent cold starts
            # starve the event loop until the liveness probe restarts the pod.
            limits: {cpu: '2', memory: 3Gi}
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /api/health/ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        # Same monitoring-mcp sidecar parsec-dev runs; reachable on localhost:3000
        # because containers in a pod share a network namespace.
        - name: icinga-mcp
          image: quay.io/rhpds/monitoring-mcp:v0.3.1
          args: ['--transport', 'sse', '--host', '0.0.0.0', '--port', '3000']
          envFrom:
            - secretRef: {name: icinga-credentials, optional: true}
          env:
            - name: PARSEC_REPORTING_MCP__MCP_URL
              value: "http://reporting-mcp.demo-reporting.svc:8080/mcp/"
          resources:
            requests: {cpu: '50m', memory: 64Mi}
            limits: {cpu: '200m', memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: parsec-sdk-config}
        - name: vertex-credentials
          secret: {secretName: vertex-credentials}
        - name: gcp-billing-credentials
          secret: {secretName: gcp-billing-credentials}
        - name: babylon-kubeconfigs
          secret: {secretName: babylon-kubeconfigs}
        - name: ocpv-kubeconfigs
          secret: {secretName: ocpv-kubeconfigs}
        - name: data
          emptyDir: {}
---
# Legacy control arm. Identical image, ConfigMap, secrets, model and connectors
# to parsec-sdk — the ONLY difference is PARSEC_AGENT__RUNTIME=legacy, which
# turns off both the SDK sub-agent path and the SDK orchestrator. This is what
# makes the parity comparison clean: comparing against parsec-dev instead would
# confound the runtime with a different image AND a litellm/qwen3-14b
# orchestrator override.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parsec-legacy
  labels: {app: parsec-legacy}
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"parsec-sdk:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"parsec\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels: {app: parsec-legacy}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: parsec-legacy}
    spec:
      containers:
        - name: parsec
          image: parsec-sdk:latest
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - secretRef: {name: parsec-cloud-credentials, optional: true}
            - secretRef: {name: parsec-aap2-credentials, optional: true}
          env:
            - name: PARSEC_AGENT__RUNTIME
              value: "legacy"
            - name: PARSEC_REPORTING_MCP__MCP_URL
              value: "http://reporting-mcp.demo-reporting.svc:8080/mcp/"
            - name: PARSEC_ICINGA__MCP_URL
              value: "http://localhost:3000/sse"
            - name: PARSEC_GITHUB__TOKEN
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: github-token, optional: true}}
            - name: PARSEC_REPORTING_MCP__TOKEN
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: reporting-mcp-token, optional: true}}
            - name: PARSEC_ALERT_API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: alert-api-key, optional: true}}
            - name: PARSEC_ANTHROPIC__LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: litellm-api-key, optional: true}}
            - name: PARSEC_LEARNINGS__LOCAL__API_KEY
              valueFrom: {secretKeyRef: {name: parsec-secrets, key: litellm-api-key, optional: true}}
            # --- Vertex for Parsec's own Anthropic client (same as parsec-dev) ---
            - name: PARSEC_ANTHROPIC__BACKEND
              value: "vertex"
            - name: PARSEC_ANTHROPIC__VERTEX_PROJECT_ID
              value: "itpc-gcp-product-all-claude"
            - name: PARSEC_ANTHROPIC__VERTEX_REGION
              value: "us-east5"
            - name: PARSEC_ANTHROPIC__VERTEX_CREDENTIALS_PATH
              value: /app/gcp/service-account.json
            - name: PARSEC_GCP__CREDENTIALS_PATH
              value: /app/gcp-billing/service-account.json
            # NOTE: parsec-dev additionally overrides the ORCHESTRATOR onto
            # litellm/qwen3-14b (PARSEC_ANTHROPIC__OVERRIDES__ORCHESTRATOR__*).
            # Deliberately not copied — the whole point here is that the Agent
            # SDK orchestrates. It is a real confound for any answer-quality
            # comparison and must be stated alongside results.
            # --- Vertex for the `claude` CLI subprocess the SDK spawns ---
            # Same project/region as Parsec's own client so both arms bill and
            # resolve identically.
            - name: CLAUDE_CODE_USE_VERTEX
              value: "1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /app/gcp/service-account.json
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              value: "itpc-gcp-product-all-claude"
            - name: CLOUD_ML_REGION
              value: "us-east5"
            - name: CLAUDE_CODE_ACCEPT_TOS
              value: "true"
            # --- Babylon / OCPV cluster kubeconfigs (mounted secrets) ---
            - {name: PARSEC_BABYLON__CLUSTERS__EAST__KUBECONFIG, value: /app/babylon/east.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__WEST__KUBECONFIG, value: /app/babylon/west.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__PARTNER0__KUBECONFIG, value: /app/babylon/partner0.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__PARTNER1__KUBECONFIG, value: /app/babylon/partner1.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__INTEGRATION__KUBECONFIG, value: /app/babylon/integration.kubeconfig}
            - {name: PARSEC_BABYLON__CLUSTERS__BABYDEV__KUBECONFIG, value: /app/babylon/babydev.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV05__KUBECONFIG, value: /app/ocpv/ocpv05.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV06__KUBECONFIG, value: /app/ocpv/ocpv06.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV07__KUBECONFIG, value: /app/ocpv/ocpv07.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV08__KUBECONFIG, value: /app/ocpv/ocpv08.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV09__KUBECONFIG, value: /app/ocpv/ocpv09.kubeconfig}
            - {name: PARSEC_OCPV__CLUSTERS__OCPV10__KUBECONFIG, value: /app/ocpv/ocpv10.kubeconfig}
          volumeMounts:
            - {name: config, mountPath: /app/config/config.yaml, subPath: config.yaml}
            - {name: vertex-credentials, mountPath: /app/gcp, readOnly: true}
            - {name: gcp-billing-credentials, mountPath: /app/gcp-billing, readOnly: true}
            - {name: babylon-kubeconfigs, mountPath: /app/babylon, readOnly: true}
            - {name: ocpv-kubeconfigs, mountPath: /app/ocpv, readOnly: true}
            - {name: data, mountPath: /app/data}
          resources:
            requests: {cpu: '500m', memory: 1Gi}
            # CPU, not memory, is the binding constraint: every SDK turn spawns a
            # `claude` subprocess, and under a tight quota concurrent cold starts
            # starve the event loop until the liveness probe restarts the pod.
            limits: {cpu: '2', memory: 3Gi}
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /api/health/ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: icinga-mcp
          image: quay.io/rhpds/monitoring-mcp:v0.3.1
          args: ['--transport', 'sse', '--host', '0.0.0.0', '--port', '3000']
          envFrom:
            - secretRef: {name: icinga-credentials, optional: true}
          env:
            - name: PARSEC_REPORTING_MCP__MCP_URL
              value: "http://reporting-mcp.demo-reporting.svc:8080/mcp/"
          resources:
            requests: {cpu: '50m', memory: 64Mi}
            limits: {cpu: '200m', memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: parsec-sdk-config}
        - name: vertex-credentials
          secret: {secretName: vertex-credentials}
        - name: gcp-billing-credentials
          secret: {secretName: gcp-billing-credentials}
        - name: babylon-kubeconfigs
          secret: {secretName: babylon-kubeconfigs}
        - name: ocpv-kubeconfigs
          secret: {secretName: ocpv-kubeconfigs}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: parsec-legacy
  labels: {app: parsec-legacy}
spec:
  selector: {app: parsec-legacy}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
# OAuth proxy: without it no X-Forwarded-Email ever reaches the app, so every
# browser request is rejected with "no user identity found in request".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parsec-sdk-oauth
  labels: {app: parsec-sdk-oauth}
spec:
  replicas: 1
  selector:
    matchLabels: {app: parsec-sdk-oauth}
  template:
    metadata:
      labels: {app: parsec-sdk-oauth}
    spec:
      serviceAccountName: parsec-sdk-oauth
      containers:
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest
          ports: [{containerPort: 8080, name: public}]
          args:
            - -provider=openshift
            - -http-address=:8080
            - -https-address=
            - -email-domain=*
            - -upstream=http://parsec-sdk:8000/
            - -openshift-service-account=parsec-sdk-oauth
            - -client-id=system:serviceaccount:rh-ace-aiops:parsec-sdk-oauth
            - -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token
            - -cookie-secret-file=/etc/proxy/secrets/session_secret
            - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - -skip-auth-regex=^/api/(health|alert/)
            # Must exceed the SDK's own ceiling or long investigations are cut
            # off by the proxy rather than by the agent.
            - -upstream-timeout=930s
            - -pass-user-headers=true
          volumeMounts:
            - {name: oauth-secret, mountPath: /etc/proxy/secrets, readOnly: true}
          resources:
            requests: {cpu: '20m', memory: 64Mi}
            limits: {cpu: '200m', memory: 256Mi}
      volumes:
        - name: oauth-secret
          secret: {secretName: parsec-sdk-oauth-secret}
---
apiVersion: v1
kind: Service
metadata:
  name: parsec-sdk
  labels: {app: parsec-sdk}
spec:
  selector: {app: parsec-sdk}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: parsec-sdk-oauth
  labels: {app: parsec-sdk-oauth}
spec:
  selector: {app: parsec-sdk-oauth}
  ports: [{name: public, port: 8080, targetPort: 8080}]
---
# Route points at the proxy, not the app.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parsec-sdk
  labels: {app: parsec-sdk}
spec:
  to: {kind: Service, name: parsec-sdk-oauth}
  port: {targetPort: public}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
